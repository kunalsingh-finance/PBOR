name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build recon demo data
        run: python scripts/build_recon_demo_data.py

      - name: Run synthetic month-end demo
        run: python -m src.run_month_end --asof 2026-01-10 --recon-data-dir data/recon_demo

      - name: Run full demo script
        run: python scripts/run_full_demo.py

      - name: Verify outputs
        run: python scripts/verify_demo_outputs.py
