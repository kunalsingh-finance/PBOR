name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run full synthetic demo
        run: python scripts/run_full_demo.py

      - name: Verify generated demo outputs
        run: python scripts/verify_demo_outputs.py

      - name: Compile dashboard
        run: python -m py_compile app/dashboard.py
